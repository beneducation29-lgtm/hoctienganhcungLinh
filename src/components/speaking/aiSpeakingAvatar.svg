<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Linh, friendly AI English speaking tutor">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f8fdff"/>
      <stop offset=".58" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#b9dff2"/>
    </radialGradient>
    <linearGradient id="skin" x1=".2" y1=".1" x2=".8" y2=".95">
      <stop offset="0" stop-color="#ffe5d1"/>
      <stop offset=".55" stop-color="#f6c8ae"/>
      <stop offset="1" stop-color="#e9ad96"/>
    </linearGradient>
    <linearGradient id="hair" x1=".15" y1=".05" x2=".85" y2=".95">
      <stop offset="0" stop-color="#30271f"/>
      <stop offset=".5" stop-color="#17151a"/>
      <stop offset="1" stop-color="#4a3028"/>
    </linearGradient>
    <linearGradient id="jacket" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#5b7c9b"/>
      <stop offset=".5" stop-color="#334f6d"/>
      <stop offset="1" stop-color="#22384f"/>
    </linearGradient>
    <linearGradient id="shirt" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0f5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#31536b" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="640" height="640" rx="92" fill="url(#bg)"/>
  <circle cx="120" cy="125" r="70" fill="#ffffff" opacity=".34" filter="url(#soft)"/>
  <circle cx="545" cy="185" r="88" fill="#ffffff" opacity=".22" filter="url(#soft)"/>

  <!-- shoulders / school-tutor outfit -->
  <path d="M96 640c12-126 84-198 185-213 23-4 55-4 78 0 101 15 173 87 185 213H96z" fill="url(#jacket)" filter="url(#shadow)"/>
  <path d="M249 431l71 82 71-82 44 34-44 175H249l-44-175z" fill="url(#shirt)"/>
  <path d="M320 501l-45-60 45-28 45 28z" fill="#9cc5df"/>
  <path d="M291 487h58l-29 31z" fill="#dcecf5"/>
  <path d="M246 468l-46 56M394 468l46 56" stroke="#7896ae" stroke-width="6" opacity=".7"/>
  <circle cx="320" cy="575" r="5" fill="#b9cfde"/>
  <circle cx="320" cy="603" r="5" fill="#b9cfde"/>

  <!-- neck -->
  <path d="M271 392v75c0 25 23 44 49 44s49-19 49-44v-75z" fill="url(#skin)"/>
  <path d="M271 392c11 31 28 46 49 46s38-15 49-46v38c-10 28-27 43-49 43s-39-15-49-43z" fill="#d89d89" opacity=".45"/>

  <!-- hair back -->
  <path d="M168 236c-13-104 42-181 153-181s166 77 153 181c-7 54-20 104-50 135-24 25-49 33-74 30l-58-20c-35 2-63-12-85-40-24-31-34-70-39-105z" fill="url(#hair)" filter="url(#shadow)"/>

  <!-- face -->
  <path d="M208 210c0-82 46-135 112-135s112 53 112 135v91c0 79-49 137-112 137s-112-58-112-137z" fill="url(#skin)"/>

  <!-- ears -->
  <ellipse cx="206" cy="286" rx="17" ry="30" fill="#efbda5"/>
  <ellipse cx="434" cy="286" rx="17" ry="30" fill="#efbda5"/>
  <path d="M201 283c8-9 13-8 16 1-7 2-10 8-9 15" fill="none" stroke="#d79884" stroke-width="4" stroke-linecap="round"/>
  <path d="M439 283c-8-9-13-8-16 1 7 2 10 8 9 15" fill="none" stroke="#d79884" stroke-width="4" stroke-linecap="round"/>

  <!-- hair cap and side locks -->
  <path d="M199 231c-9-78 31-155 121-155 77 0 125 57 121 146-31-13-55-37-71-70-37 49-86 75-171 79z" fill="url(#hair)"/>
  <path d="M208 208c-17 54-13 124 15 164-35-25-50-72-48-119 3-70 36-127 94-154-31 31-53 66-61 109z" fill="#211b19"/>
  <path d="M432 205c17 54 13 124-15 164 35-25 50-72 48-119-3-70-36-127-94-154 31 31 53 66 61 109z" fill="#211b19"/>
  <path d="M232 145c24-40 57-61 97-61 46 0 80 26 101 73-43-15-78-41-105-76-28 33-59 55-93 64z" fill="#4a342b" opacity=".7"/>

  <!-- brows -->
  <path d="M242 246c17-13 38-15 58-5" fill="none" stroke="#4b332c" stroke-width="9" stroke-linecap="round"/>
  <path d="M340 241c20-10 41-8 58 5" fill="none" stroke="#4b332c" stroke-width="9" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M242 270c16-16 42-16 58 0-15 19-43 19-58 0z" fill="#fff"/>
  <path d="M340 270c16-16 42-16 58 0-15 19-43 19-58 0z" fill="#fff"/>
  <ellipse cx="272" cy="270" rx="9" ry="11" fill="#49362e"/>
  <ellipse cx="368" cy="270" rx="9" ry="11" fill="#49362e"/>
  <circle cx="275" cy="266" r="3.5" fill="#fff"/>
  <circle cx="371" cy="266" r="3.5" fill="#fff"/>
  <path d="M239 267c18-23 47-23 63 1M337 268c16-24 45-24 64-1" fill="none" stroke="#3a2a26" stroke-width="5" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M316 267c-3 23-9 47-6 60 3 9 12 13 24 8" fill="none" stroke="#d99680" stroke-width="5" stroke-linecap="round"/>
  <path d="M301 340c8 6 29 6 38 0" fill="none" stroke="#d08b79" stroke-width="4" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="244" cy="324" rx="22" ry="12" fill="#e99688" opacity=".22"/>
  <ellipse cx="396" cy="324" rx="22" ry="12" fill="#e99688" opacity=".22"/>

  <!-- smile -->
  <path d="M282 351c22 18 54 18 76 0" fill="none" stroke="#a95e5d" stroke-width="6" stroke-linecap="round"/>
  <path d="M294 355c15 9 36 9 52 0-5 18-44 20-52 0z" fill="#f6a6a0" opacity=".75"/>

  <!-- subtle hair highlights -->
  <path d="M226 157c18-34 45-56 77-65M399 170c-13-30-32-50-58-66" fill="none" stroke="#6b5145" stroke-width="7" stroke-linecap="round" opacity=".42"/>

  <!-- friendly AI indicator -->
  <circle cx="535" cy="525" r="36" fill="#ffffff" opacity=".9"/>
  <circle cx="535" cy="525" r="22" fill="#35b8a0"/>
  <path d="M524 526l7 7 15-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>