name: Build and typecheck

on:
  push:
    branches: ["main", "feat/ai-speaking-room", "feat/ui-auth-curriculum-2026"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build
