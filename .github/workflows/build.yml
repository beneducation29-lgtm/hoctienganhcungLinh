name: Build and typecheck

on:
  push:
    branches: ["main", "feat/ai-speaking-room", "feat/reading-listening-lab", "feat/writing-lab-ai-coach"]
  pull_request:
    branches: ["main", "feat/ai-speaking-room", "feat/reading-listening-lab", "feat/writing-lab-ai-coach"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
